name: Action quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: action-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and four coverage gates
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --omit=optional
      - name: Check dependency advisories
        run: npm audit --omit=optional --audit-level=moderate
      - name: Test all implementation files and enforce four coverage gates
        run: npm run coverage
      - name: Publish coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 30
